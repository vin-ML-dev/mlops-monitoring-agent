apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-gateway
  namespace: finbot
  labels: { app: fastapi-gateway }
spec:
  replicas: 1
  selector:
    matchLabels: { app: fastapi-gateway }
  template:
    metadata:
      labels: { app: fastapi-gateway }
    spec:
      containers:
        - name: gateway
          image: fastapi-gateway:v1.0.0        # built locally + loaded into kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: gateway-config }
          env:
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef: { name: gateway-secret, key: GATEWAY_API_KEY }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }   # gateway is light; the model is heavy
            limits:   { cpu: "500m", memory: "256Mi" }
          # liveness is cheap + model-independent (never restart the gateway for a model outage)
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          # readiness reflects gateway + Redis (rate limiting depends on it)
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 10
