# kube-prometheus-stack Helm values — trimmed for a single-node kind cluster.
# Everything (model + gateway + redis + this stack) shares one laptop node, so we
# shrink replicas/retention/resources. On Day 8's real 3 nodes, use defaults.

fullnameOverride: kps

# ---------------------------------------------------------------------------
# Silence the chart's BUILT-IN Kubernetes alert rules and keep ONLY your finbot
# rules. On single-node kind these built-ins misfire constantly (e.g.
# KubeAPIErrorBudgetBurn, KubePodCrashLooping, TargetDown) because there's no real
# API error budget / control plane to measure. `create: false` removes ALL ~40 of
# them, which also removes the "Watchdog" always-firing heartbeat — fine locally
# (you have no external monitor watching Watchdog anyway). Re-enable on Day 8.
#
# TOP LEVEL — zero indent, a sibling of alertmanager:/prometheus:. NOT nested.
defaultRules:
  create: false
#
# --- Surgical alternative (keep Watchdog + useful rules, drop only the noisy
#     apiserver SLO/burn-rate rules that cause KubeAPIErrorBudgetBurn) ---
# defaultRules:
#   create: true
#   rules:
#     kubeApiserverSlos: false
#     kubeApiserverBurnrate: false
#     kubeApiserverAvailability: false
#     kubeApiserverHistogram: false

# --- disable control-plane scrape jobs that don't exist on kind (avoids noisy "target down") ---
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeProxy:             { enabled: false }
kubeEtcd:              { enabled: false }

# --- Prometheus (StatefulSet) ---
prometheus:
  prometheusSpec:
    replicas: 1
    retention: 6h
    scrapeInterval: 15s
    evaluationInterval: 15s
    # CRITICAL: discover OUR ServiceMonitors/PrometheusRules even without the Helm release label.
    # Without these set to false, Prometheus only picks up objects labelled release=kps.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits:   { memory: 900Mi }
    # ephemeral storage on kind (data is fine to lose locally; avoids PVC hassle)
    # -> omit storageSpec so it uses emptyDir

# --- Alertmanager (StatefulSet) — Path 1: the reliable Slack alerting path ---
#
# LESSON baked into the templates below:
#   * a RULE annotation describes the CONDITION and is state-agnostic — the same
#     text is sent whether firing OR resolved (it's written in a "firing" voice).
#   * only the TEMPLATE knows .Status, so ALL state-dependent wording — the
#     FIRING/RESOLVED label AND the body — must live here and be gated on .Status.
#   Printing a raw "…is down" description on resolve is what produced the
#   "RESOLVED · … the agent is down" contradiction. The `if eq .Status "firing"`
#   guards below fix that for every alert at once.
#   Keep each template on ONE line (single-quoted) so no stray newlines leak.
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits:   { memory: 128Mi }
    # mount the Slack webhook secret at /etc/alertmanager/secrets/alertmanager-slack/webhook
    secrets:
      - alertmanager-slack
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-default
      group_by: ["alertname", "severity", "namespace"]
      group_wait: 30s          # batch related alerts before the first send
      group_interval: 1m       # how often to send updates about a group
      repeat_interval: 4h      # re-send a still-firing alert this often
      routes:
        - matchers: ['severity="critical"']
          receiver: slack-critical
          repeat_interval: 1h  # critical repeats more often
    receivers:
      - name: slack-default
        slack_configs:
          - channel: "#finbot-alerts"
            send_resolved: true
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} · {{ .CommonLabels.alertname }} · {{ .CommonLabels.severity }}'
            text: '{{ if eq .Status "firing" }}{{ range .Alerts }}*{{ .Annotations.summary }}* — {{ .Annotations.description }}{{ "\n" }}{{ end }}{{ else }}✅ Recovered — the condition has cleared.{{ end }}'
      - name: slack-critical
        slack_configs:
          - channel: "#finbot-alerts"
            send_resolved: true
            api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: '{{ if eq .Status "firing" }}🔥 [CRITICAL] FIRING{{ else }}✅ [CRITICAL] RESOLVED{{ end }} · {{ range .Alerts }}{{ .Labels.alertname }}{{ end }}'
            text: '{{ if eq .Status "firing" }}{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}{{ else }}✅ Recovered — the condition has cleared.{{ end }}'

# --- Grafana (Deployment) — human dashboards, optional ---
# Disabled locally: on kind it OOM-killed at 384Mi. Re-enable on Day 8 (real nodes)
# or bump the limit to ~512Mi if you want it locally. Leftover config below is
# ignored while enabled=false — kept so re-enabling is a one-line change.
grafana:
  enabled: false
  adminPassword: admin           # LOCAL ONLY — change / use a secret in production
  defaultDashboardsEnabled: true
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits:   { memory: 512Mi }  # was 384Mi -> OOM-killed; give it more headroom
  # auto-load dashboards from ConfigMaps labelled grafana_dashboard=1
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

# --- keep kube-state-metrics (pod restart signals) + node-exporter, small ---
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
