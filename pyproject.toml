[project]
name = "mlops-monitoring-agent"
version = "0.1.0"
description = "Finance domain LLM platform. Day 1: data curation."
requires-python = ">=3.11"

# --- core runtime (needed to RUN the pipeline) ---
dependencies = [
    "pydantic>=2.6",
    "langdetect>=1.0.9",
    "PyYAML>=6.0",
    "datasets>=2.19",   # stream the dataset from Hugging Face
    "dvc>=3.50",        # data + pipeline versioning
]

# --- optional groups (install only what you need) ---
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
pii = [                 # heavy NER PII layer — install when you enable Presidio
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ is the package root
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
